name: Update the JPEG XL encoder
on:
  schedule:
    # Mondays at 04:37 UTC, at night in Belgium and at a quiet minute. libjxl releases a few times a year
    - cron: '37 4 * * 1'
  workflow_dispatch:

# Nothing by default: each job asks for what it needs
permissions: {}

# bash -eo pipefail rather than GitHub's default bash -e, so a command that fails on the left of a pipe fails the step
defaults:
  run:
    shell: bash

# Dependabot can't follow cjxl, a file of libjxl's GitHub releases rather than a package: this raises bin/cjxl.version
# to libjxl's newest release, checked against the SHA-256 GitHub gives for the file, and deploys it once
# bin/fetch-cjxl.sh has tested it makes JPEG XL as the site runs it. A version that fails stays out and fails this
# run, which GitHub emails about; the site keeps the previous one. Runs on main only: the key that pushes there
# (bin/push-main.sh) is in the repo-bot environment. Its push starts deploy.yml like any other.
# Same rule as deploy.yml: no marketplace actions, only plain git.
jobs:
  update:
    # An exact Ubuntu version rather than ubuntu-latest, which GitHub moves to each new release over a few weeks
    runs-on: ubuntu-26.04
    environment: repo-bot
    timeout-minutes: 10
    permissions:
      contents: read        # clone the repository (pushing is MAIN_PUSH_KEY's)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch main \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          # Without the token, which the steps below don't need (the repository is public): not left for the downloaded
          # cjxl to read
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Look for a new version
        id: check
        run: |
          read -r current _ < <(grep -v '^#' bin/cjxl.version)
          read -r tag digest < <(gh api repos/libjxl/libjxl/releases/latest --jq \
            '"\(.tag_name) \(.assets[] | select(.name == "jxl-linux-x86_64-static.tar.lz") | .digest // "")"')
          if [ "$tag" = "$current" ]; then
            echo "cjxl $current is the newest"
            exit 0
          fi
          # Older releases have no digest: rather than trusting the download, wait for one that does
          [[ $digest == sha256:* ]] || { echo "::error::libjxl $tag gives no SHA-256 for its static build"; exit 1; }
          sed -i -E "s/^v[^ ]+ [0-9a-f]{64}$/$tag ${digest#sha256:}/" bin/cjxl.version
          echo "new=$tag" >> "$GITHUB_OUTPUT"
          echo "Testing cjxl $tag (was $current)"
      - name: Test it
        if: steps.check.outputs.new
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          command -v lzip > /dev/null || { timeout 300 $APT update && timeout 300 $APT install -y --no-install-recommends lzip; }
          bin/fetch-cjxl.sh
      - name: Push and deploy
        if: steps.check.outputs.new
        env:
          TAG: ${{ steps.check.outputs.new }}
          MAIN_PUSH_KEY: ${{ secrets.MAIN_PUSH_KEY }}
        run: |
          git commit --quiet -m "Update cjxl to $TAG" \
            -m "https://github.com/libjxl/libjxl/releases/tag/$TAG" -- bin/cjxl.version
          # In case something was pushed during the test
          git pull --quiet --rebase origin main
          bin/push-main.sh
