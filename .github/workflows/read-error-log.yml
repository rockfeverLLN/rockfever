name: Delete PHP error log
on:
  workflow_dispatch:

permissions:
  contents: read

# TEMPORARY: removes the php-error.log left by the debugging capture, then this workflow is deleted
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Delete php-error.log
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u rockfevexj sftp://ftp.cluster105.hosting.ovh.net -e "
            set sftp:auto-confirm yes;
            rm -f php-error.log;
            cls -l;
            quit"
