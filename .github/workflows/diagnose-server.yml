name: Diagnose server
on:
  workflow_dispatch:

permissions:
  contents: read

# TEMPORARY, read-only: disk usage and leftover files on the server while the site answers 500. Deleted afterwards.
# The repository is public: print sizes and file names only, never file contents
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
      - name: PHP errors
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; get php-error.log; quit" || { echo "No log"; exit 0; }
          wc -l php-error.log
          # The errors only (their messages and stack frames), not the requests' data
          grep -E "PHP (Fatal|Parse|Warning)|Uncaught|#[0-9]+ " php-error.log | cut -c1-400 | tail -60
