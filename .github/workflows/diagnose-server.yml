name: Diagnose server
on:
  workflow_dispatch:

permissions:
  contents: read

# Read-only: the last PHP errors of php-error.log (see www/index.php), as OVH's own logs don't show them.
# The repository is public, so are these logs: only the error messages and stack frames, never the requests' data
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
      - name: PHP errors
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; get php-error.log; quit" || { echo "No log"; exit 0; }
          wc -l php-error.log
          # The errors only (their messages and stack frames), not the requests' data
          grep -E "PHP |Uncaught|Exception|Error|#[0-9]+ " php-error.log | cut -c1-400 | tail -60
      - name: PHP probe
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          # Whether PHP runs at all: a one-line script and a static file, uploaded, requested, then removed
          name="probe-$RANDOM$RANDOM"
          # PHP's building blocks one at a time: the site dies while rendering (#151), in plain PHP code. A crash
          # shows after the last step printed
          cat > "$name.php" <<'PHP'
          <?php
          header('Content-Type: text/plain');
          // Before any output, which a session needs
          $session = var_export(session_start() && session_write_close(), true);
          while (ob_get_level()) { ob_end_flush(); }
          function step($s) { echo $s, "\n"; flush(); }
          register_shutdown_function(function () { step('end'); });
          step("session: $session");
          step('pcre.jit=' . ini_get('pcre.jit') . ' ' . PCRE_VERSION . ' mbstring=' . var_export(extension_loaded('mbstring'), true) . ' intl=' . var_export(extension_loaded('intl'), true) . ' session.save_path=' . ini_get('session.save_path'));
          $tests = [
              'htmlspecialchars' => fn () => htmlspecialchars('<a> é', ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8'),
              'preg_match' => fn () => preg_match('/a+b/', 'aaab'),
              'preg_match /u' => fn () => preg_match('/\\w+/u', 'héllo'),
              'preg_replace_callback /u' => fn () => preg_replace_callback('/[^a-z]/u', fn ($m) => '-', 'héllo wörld'),
              'preg_split /u' => fn () => preg_split('//u', 'héllo', -1, PREG_SPLIT_NO_EMPTY),
              'mb_strtolower' => fn () => mb_strtolower('ÉCOLE'),
              'mb_convert_encoding' => fn () => mb_convert_encoding('é', 'UTF-16BE', 'UTF-8'),
              'iconv' => fn () => iconv('UTF-8', 'UTF-16BE', 'é'),
              'json_encode' => fn () => json_encode(['a' => 'é']),
              'number_format' => fn () => number_format(1234.5, 2, ',', ' '),
              'strftime-free date' => fn () => date('c'),
              'IntlDateFormatter' => fn () => class_exists('IntlDateFormatter') ? (new IntlDateFormatter('fr_BE', IntlDateFormatter::FULL, IntlDateFormatter::NONE))->format(time()) : 'no intl',
              'random_bytes' => fn () => bin2hex(random_bytes(4)),
              'hash xxh128' => fn () => hash('xxh128', 'x'),
          ];
          foreach ($tests as $label => $test) {
              step("$label ...");
              try { $r = $test(); step("  ok " . substr(is_scalar($r) ? (string) $r : json_encode($r), 0, 60)); } catch (Throwable $e) { step('  ' . get_class($e) . ': ' . $e->getMessage()); }
          }
          PHP
          sed -i 's/^          //' "$name.php"
          echo static-ok > "$name.txt"
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 20; put $name.php -o www/$name.php; put $name.txt -o www/$name.txt; quit"
          curl -sS -m 60 -A 'Mozilla/5.0 (rockfever probe)' -w "  -> %{http_code} in %{time_total}s\n" "https://rockfever.be/$name.php" | tail -60 || true
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set cmd:fail-exit no; rm -f www/$name.php www/$name.txt; cls -l --sort=date | head -20; quit"
