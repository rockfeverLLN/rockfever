name: Diagnose server
on:
  workflow_dispatch:

permissions:
  contents: read

# TEMPORARY, read-only: disk usage and leftover files on the server while the site answers 500. Deleted afterwards.
# The repository is public: print sizes and file names only, never file contents
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
      - name: Permissions
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          echo test > perm-test.txt
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "
            set sftp:auto-confirm yes; set cmd:fail-exit no; set net:timeout 20; set net:max-retries 2;
            pwd; cls -ld . www www/index.php config vendor views tmp;
            put perm-test.txt -o perm-test.txt; put perm-test.txt -o www/perm-test.txt; put perm-test.txt -o tmp/perm-test.txt;
            cls -l perm-test.txt www/perm-test.txt tmp/perm-test.txt;
            rm -f perm-test.txt www/perm-test.txt tmp/perm-test.txt;
            quit" 2>&1
