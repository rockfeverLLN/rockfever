name: Diagnose server
on:
  workflow_dispatch:

permissions:
  contents: read

# Read-only: the last PHP errors of php-error.log (see www/index.php), as OVH's own logs don't show them.
# The repository is public, so are these logs: only the error messages and stack frames, never the requests' data
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
      - name: PHP errors
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; get php-error.log; quit" || { echo "No log"; exit 0; }
          wc -l php-error.log
          # The errors only (their messages and stack frames), not the requests' data
          grep -E "PHP |Uncaught|Exception|Error|#[0-9]+ " php-error.log | cut -c1-400 | tail -60
      - name: PHP probe
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          # Whether PHP runs at all: a one-line script and a static file, uploaded, requested, then removed
          name="probe-$RANDOM$RANDOM"
          # OPcache's settings and what it holds for index.php, then a reset of it (it may keep serving old code)
          cat > "$name.php" <<'PHP'
          <?php
          header('Content-Type: text/plain');
          foreach (['opcache.enable', 'opcache.validate_timestamps', 'opcache.revalidate_freq', 'opcache.file_cache', 'opcache.file_cache_only'] as $k) { echo $k, '=', var_export(ini_get($k), true), "\n"; }
          $index = dirname(__FILE__) . '/index.php';
          echo 'index.php md5=', md5_file($index), ' mtime=', date('c', filemtime($index)), "\n";
          $st = @opcache_get_status(true);
          foreach (($st['scripts'] ?? []) as $path => $info) { if (str_ends_with($path, 'www/index.php') || str_ends_with($path, 'Framework/App.php')) { echo 'cached ', $path, ' at ', date('c', $info['timestamp'] ?? 0), "\n"; } }
          echo 'cached scripts: ', count($st['scripts'] ?? []), "\n";
          echo 'reset: ', var_export(opcache_reset(), true), "\n";
          PHP
          sed -i 's/^          //' "$name.php"
          echo static-ok > "$name.txt"
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 20; put $name.php -o www/$name.php; put $name.txt -o www/$name.txt; quit"
          for f in "$name.txt" "$name.php" "" "login"; do
            curl -sS -m 60 -A 'Mozilla/5.0 (rockfever probe)' -w "  -> %{http_code} in %{time_total}s\n" "https://rockfever.be/$f" || true
          done
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set cmd:fail-exit no; rm -f www/$name.php www/$name.txt; cls -l --sort=date | head -20; quit"
