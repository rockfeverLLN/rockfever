name: Diagnose server
on:
  workflow_dispatch:

permissions:
  contents: read

# Read-only: the last PHP errors of php-error.log (see www/index.php), as OVH's own logs don't show them.
# The repository is public, so are these logs: only the error messages and stack frames, never the requests' data
jobs:
  diagnose:
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
      - name: PHP errors
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; get php-error.log; quit" || { echo "No log"; exit 0; }
          wc -l php-error.log
          # The errors only (their messages and stack frames), not the requests' data
          grep -E "PHP |Uncaught|Exception|Error|#[0-9]+ " php-error.log | cut -c1-400 | tail -60
      - name: PHP probe
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          # Whether PHP runs at all: a one-line script and a static file, uploaded, requested, then removed
          name="probe-$RANDOM$RANDOM"
          # index.php's first lines one at a time, as the process dies on entering it (#148)
          cat > "$name.php" <<'PHP'
          <?php
          header('Content-Type: text/plain');
          while (ob_get_level()) { ob_end_flush(); }
          function step($s) { echo $s, "\n"; flush(); }
          register_shutdown_function(function () { step('end'); });
          step('start, error_log=' . var_export(ini_get('error_log'), true) . ' log_errors=' . ini_get('log_errors') . ' display_errors=' . ini_get('display_errors'));
          $log = dirname(__DIR__) . '/php-error.log';
          step('log file: exists=' . var_export(file_exists($log), true) . ' is_dir=' . var_export(is_dir($log), true) . ' writable dir=' . var_export(is_writable(dirname($log)), true));
          ini_set('log_errors', '1');
          step('log_errors set');
          ini_set('error_log', $log);
          step('error_log set');
          error_log('probe: test line');
          step('error_log written, exists now=' . var_export(file_exists($log), true));
          chdir(dirname(__DIR__));
          step('chdir ok, cwd=' . getcwd());
          step('compile index.php: ' . var_export(opcache_compile_file(__DIR__ . '/index.php'), true));
          PHP
          sed -i 's/^          //' "$name.php"
          echo static-ok > "$name.txt"
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 20; put $name.php -o www/$name.php; put $name.txt -o www/$name.txt; quit"
          curl -sS -m 60 -A 'Mozilla/5.0 (rockfever probe)' -w "  -> %{http_code} in %{time_total}s\n" "https://rockfever.be/$name.php" | tail -40 || true
          lftp --env-password -u rockfevexj "sftp://$FTP_HOST" -e "set sftp:auto-confirm yes; set cmd:fail-exit no; rm -f www/$name.php www/$name.txt; cls -l --sort=date | head -20; quit"
