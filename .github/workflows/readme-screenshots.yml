name: README screenshots
on:
  # After each deploy, once the new version is live
  workflow_run:
    workflows: [Deploy to OVH]
    types: [completed]
    branches: [main]
  # And every Monday at 05:23 UTC, since the home page changes with the soirées and the admin without a deploy
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

permissions:
  contents: read

# Takes .github/assets/desktop.jpg and phones.webp again from the live site (bin/readme-screenshots.mjs) and commits
# them when they changed. deploy.yml skips the pushes that only change them, and .github isn't uploaded anyway.
# Same rule as deploy.yml: no marketplace actions, only plain git and the Chrome and Node already on the runner.
defaults:
  run:
    shell: bash

jobs:
  screenshots:
    # Not after a deploy that failed: the live site is still the previous version
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # An exact Ubuntu version rather than ubuntu-latest, which GitHub moves to each new release over a few weeks
    runs-on: ubuntu-26.04
    # Holds the key that pushes to main (bin/push-main.sh)
    environment: repo-bot
    timeout-minutes: 10
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch main \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Take the screenshots
        run: node $(node -e WebSocket 2> /dev/null || echo --experimental-websocket) --no-warnings bin/readme-screenshots.mjs
      - name: Commit them if they changed
        env:
          MAIN_PUSH_KEY: ${{ secrets.MAIN_PUSH_KEY }}
        run: |
          if git diff --quiet -- .github/assets; then
            echo "The screenshots haven't changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Take the README screenshots again from the live site" -- .github/assets
          # In case something was pushed meanwhile
          git pull --quiet --rebase origin main
          bin/push-main.sh
