name: Test
on:
  pull_request:
  workflow_dispatch:
    inputs:
      # Set by .github/workflows/dependabot-retry.yml: a Dependabot update that failed, tested again on today's main
      pr:
        description: Pull request to test merged with main (its number), and merge if it's Dependabot's and passes
        required: false
      sha:
        description: That pull request's head commit, which only is merged
        required: false

# A new push to the pull request replaces the run of the previous one
concurrency:
  group: test-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

# Nothing by default: each job asks for what it needs
permissions: {}

# bash -eo pipefail rather than GitHub's default bash -e, so a command that fails on the left of a pipe fails the step
defaults:
  run:
    shell: bash

# Tests every pull request on a copy of the site (bin/test.sh). Dependabot's updates (.github/dependabot.yml), major
# versions included, that pass are merged and deployed without anyone needing to do anything. One that fails is tested
# again on main as it then is (.github/workflows/dependabot-retry.yml), and merged once it passes.
# Same rule as deploy.yml: no marketplace actions, only plain git and official images.
jobs:
  test:
    # An exact Ubuntu version rather than ubuntu-latest, which GitHub moves to each new release over a few weeks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read        # fetch the commit to test, and ask whether a pull request merges
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: rockfever
          MARIADB_USER: rockfever
          MARIADB_PASSWORD: ci
          MARIADB_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # The pull request's own commit, not the merge with main GitHub prepares. Except for a Dependabot update tested
      # again: its merge with today's main, which has the fixes made since it failed
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ inputs.pr }}
        run: |
          git init --quiet .
          ref=$SHA
          if [ -n "$PR" ]; then
            # GitHub works out the merge (refs/pull/N/merge) when asked whether it can be merged
            for i in $(seq 10); do
              mergeable=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .mergeable)
              [ "$mergeable" != null ] && break
              sleep 3
            done
            if [ "$mergeable" != true ]; then
              echo "::error::Pull request #$PR doesn't merge with main: Dependabot rebases it on its own"
              exit 1
            fi
            ref=refs/pull/$PR/merge
          fi
          git fetch --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ref"
          git checkout --quiet FETCH_HEAD
      # zizmor, a security linter for GitHub Actions, over the workflows and .github/dependabot.yml: too-broad
      # permissions, tokens left behind, template injection, dangerous triggers. Its official image, pinned to a version
      # and its digest, raised by hand (https://github.com/zizmorcore/zizmor/releases). --offline: its online audits only
      # look at marketplace actions, which these workflows don't use
      - name: zizmor
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d \
            --offline --format=github .
      # Same PHP version as the server, read from .ovhconfig
      - name: Read PHP version
        run: echo "PHP_VERSION=$(sed -n 's/^app\.engine\.version=//p' .ovhconfig)" >> "$GITHUB_ENV"
      - name: Start a test database
        run: |
          printf 'FROM php:%s-cli\nRUN docker-php-ext-install pdo_mysql\n' "$PHP_VERSION" | docker build -q -t site-php -
          docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app \
            composer:2 install --no-interaction --no-progress --quiet
          cat > config/database.php <<'EOF'
          <?php
          return [
              'database.host'     => '127.0.0.1',
              'database.username' => 'rockfever',
              'database.password' => 'ci',
              'database.name'     => 'rockfever',
          ];
          EOF
          site() {
            docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app site-php "$@"
          }
          site vendor/bin/phinx migrate
          site vendor/bin/phinx seed:run
      - name: Test
        run: bin/test.sh
      # The cjxl the deploy would upload (bin/cjxl.version), tested as the site runs it
      - name: Test the JPEG XL encoder
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          command -v lzip > /dev/null || { timeout 300 $APT update && timeout 300 $APT install -y --no-install-recommends lzip; }
          bin/fetch-cjxl.sh

  # Dependabot's updates that passed go live, major versions included. Merged here rather than with GitHub's auto-merge, which needs a
  # branch protection rule; and a merge made with this job's token doesn't start deploy.yml on its own, so it's
  # started here
  merge:
    needs: test
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.pr != '' && inputs.sha != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One merge at a time: two updates passing together would otherwise both deploy the same commit
    concurrency:
      group: dependabot-merge
      cancel-in-progress: false
    permissions:
      contents: write       # merge the pull request
      pull-requests: write
      actions: write        # start the deploy
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/pull/{2}', github.server_url, github.repository, inputs.pr) }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.sha }}
    steps:
      - name: Merge and deploy
        run: |
          # Only Dependabot's own pull request and commit, as it made them: a commit someone else pushed to its branch
          # waits for someone to merge it
          author=$(gh pr view "$PR_URL" --json author --jq .author.login)
          message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq .commit.message)
          if [ "$author" != app/dependabot ] || ! grep -q 'dependency-name:' <<< "$message"; then
            echo "::notice::Not Dependabot's update as it made it: it stays open for someone to read and merge"
            exit 0
          fi
          # --match-head-commit: not if Dependabot pushed again during the tests, the newer run will merge it.
          # If another update was merged meanwhile and conflicts, Dependabot rebases this one and it's tested again
          gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
