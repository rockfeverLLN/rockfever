name: Update dependencies
on:
  schedule:
    # Every other day (odd days of the month) at 04:17 UTC, at night in Belgium and at a quiet minute: GitHub delays
    # the runs planned on the hour. A 31st is followed by the 1st, so those two runs come one day apart
    - cron: '17 4 */2 * *'
  workflow_dispatch:

concurrency:
  group: update-dependencies
  cancel-in-progress: false

permissions:
  contents: write  # push the updates
  actions: write   # start the deploy (pushes made with this job's token don't trigger it on their own)
  issues: write    # keep the "Automatic package update failed" issue current

# Installs every new version of the PHP packages and JavaScript libraries, major ones included, within two days:
# the check job looks for new versions every other day in a few seconds, and only when there's one does the update job
# test it on a copy of the site (bin/auto-update.sh) and deploy it. An update whose tests fail isn't installed: it's
# listed in an issue, and isn't tried again until a newer version comes out.
# Same rule as deploy.yml: no marketplace actions, only plain git and official images.
env:
  GH_TOKEN: ${{ github.token }}
  ISSUE_TITLE: Automatic package update failed

# bash -eo pipefail rather than GitHub's default bash -e: without it, a failed `bin/auto-update.sh candidates` piped
# into sort passed as "Everything is up to date"
defaults:
  run:
    shell: bash

jobs:
  check:
    # An exact Ubuntu version rather than ubuntu-latest, which GitHub moves to each new release over a few weeks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      new: ${{ steps.check.outputs.new }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Read PHP version
        run: echo "PHP_VERSION=$(sed -n 's/^app\.engine\.version=//p' .ovhconfig)" >> "$GITHUB_ENV"
      - name: Look for new versions
        id: check
        run: |
          bin/auto-update.sh candidates | sort -u > candidates.txt
          # The updates that failed their tests are in the open issue: don't test them again on every run
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json body --jq '.[0].body // ""' | sed -n '/^<!-- failed$/,/^-->$/p' | grep '@' | sort -u > failed.txt || true
          comm -23 candidates.txt failed.txt > new.txt
          if [ -s new.txt ]; then
            echo "New versions to test:"
            cat new.txt
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif [ -s candidates.txt ]; then
            echo "Only versions that already failed their tests:"
            cat candidates.txt
          else
            echo "Everything is up to date"
          fi

  update:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: rockfever
          MARIADB_USER: rockfever
          MARIADB_PASSWORD: ci
          MARIADB_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Same PHP version as the server, read from .ovhconfig
      - name: Read PHP version
        run: echo "PHP_VERSION=$(sed -n 's/^app\.engine\.version=//p' .ovhconfig)" >> "$GITHUB_ENV"
      - name: Start a test database
        run: |
          printf 'FROM php:%s-cli\nRUN docker-php-ext-install pdo_mysql\n' "$PHP_VERSION" | docker build -q -t site-php -
          docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app \
            composer:2 install --no-interaction --no-progress --quiet
          cat > config/database.php <<'EOF'
          <?php
          return [
              'database.host'     => '127.0.0.1',
              'database.username' => 'rockfever',
              'database.password' => 'ci',
              'database.name'     => 'rockfever',
          ];
          EOF
          site() {
            docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app site-php "$@"
          }
          site vendor/bin/phinx migrate
          site vendor/bin/phinx seed:run
      - name: Install and test the updates
        run: bin/auto-update.sh apply
      - name: Push and deploy
        run: |
          if [ "$(git rev-list --count "origin/$GITHUB_REF_NAME..HEAD")" -eq 0 ]; then
            echo "No update passed its tests"
            exit 0
          fi
          git log --format='### %s%n%n%b' "origin/$GITHUB_REF_NAME..HEAD" >> "$GITHUB_STEP_SUMMARY"
          # In case something was pushed during the tests
          git pull --quiet --rebase origin "$GITHUB_REF_NAME"
          git push --quiet origin "HEAD:$GITHUB_REF_NAME"
          # Only main goes live: a run started by hand on another branch just tests and pushes there
          if [ "$GITHUB_REF_NAME" = main ]; then
            gh workflow run deploy.yml --ref main
          fi
      - name: Report the updates that failed
        if: always()
        run: |
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number --jq '.[0].number')
          if [ -s failed.txt ]; then
            # The list the check job reads comes first, so cutting a long body to GitHub's limit keeps it
            {
              echo '<!-- failed'
              sort -u failed.txt
              echo '-->'
              echo "These updates weren't installed because the site failed its tests with them. Nothing needs doing"
              echo "for the site to keep working: it stays on the previous versions, and each one is tried again"
              echo "automatically as soon as a newer version is out. To install one now, the code needs a change."
              echo
              cat failed.md
            } > issue-full.md
            # Not piped into head: with pipefail, head closing the pipe early on a long body would fail the step
            head -c 60000 issue-full.md > issue.md
            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue.md
            fi
          elif [ -n "$ISSUE" ] && [ -f failed.txt ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "Every update is installed now."
          fi
